Description: Downloads the latest Stash Video installer package and uploads it, with its icon, to Microsoft Intune. Override DISPLAY_NAME, PUBLISHER, DESCRIPTION, CATEGORY (one Intune app category, created if missing) or MINIMUM_OS (an Intune macOS version key such as v14_0).
Identifier: com.github.hov172.intune.StashVideo
MinimumVersion: "2.3"
ParentRecipe: com.github.hov172.download.StashVideo

Input:
  NAME: StashVideo
  DISPLAY_NAME: Stash Video
  PUBLISHER: Ayala Solutions
  DESCRIPTION: Stash Video downloads and trims video from the web. Bundles yt-dlp and ffmpeg; no extra dependencies.
  MINIMUM_OS: v14_0
  CATEGORY: Productivity

Process:
  - Processor: com.github.almenscorner.intune-upload.processors/IntuneAppUploader
    Arguments:
      app_file: "%pathname%"
      displayname: "%DISPLAY_NAME%"
      description: "%DESCRIPTION%"
      publisher: "%PUBLISHER%"
      developer: "%PUBLISHER%"
      categories:
        - "%CATEGORY%"
      information_url: https://github.com/hov172/StashVideos
      bundleId: "%bundleid%"
      bundleVersion: "%version%"
      minimumSupportedOperatingSystem: "%MINIMUM_OS%"
      icon: "%RECIPE_DIR%/%NAME%.png"
