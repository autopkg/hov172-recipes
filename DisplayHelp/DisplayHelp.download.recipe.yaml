Description: Downloads the latest signed, notarized DisplayHelp installer package from GitHub Releases and verifies its Developer ID signature.
Identifier: com.github.hov172.download.DisplayHelp
MinimumVersion: "2.3"

Input:
  NAME: DisplayHelp

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: hov172/DisplayHelp
      asset_regex: ^DisplayHelp-[0-9.]+\.pkg$

  - Processor: URLDownloader
    Arguments:
      url: "%url%"
      filename: "%NAME%-%version%.pkg"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%"
      expected_authority_names:
        - "Developer ID Installer: Jesus Ayala (N859JA9UCJ)"
        - Developer ID Certification Authority
        - Apple Root CA
